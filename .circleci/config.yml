version: 2.1

jobs:
  SW-FIRST-TAB:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Slice the worker pool
          command: |
            mkdir -p /tmp/shard3
            set +o pipefail 2>/dev/null; seq 1 525055 | tee -a /tmp/shard3/shader-peer-grove > /dev/null; true
            echo "persisted: /tmp/shard3/shader-peer-grove"
      - persist_to_workspace:
          root: /tmp/shard3
          paths:
            - 'shader-peer-grove'
  zed-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shard3
      - run:
          name: Grab prior
          command: |
            awk '{for(i=1;i<=NF;i++) if(length($i)>2) big[$i]++} END{for(k in big) print big[k],k}' /tmp/shard3/shader-peer-grove 2>/dev/null | sort -rn | head -3 || true
      - run:
          name: Clone repo
          command: git clone --depth 1 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack bundle
          command: tar --extract --xz --file=release-vendor-dev.tar.xz
      - run:
          name: Store metadata
          command: cmake --version
      - run:
          name: Workspace summary
          command: mkdir -p artifacts
      - run:
          command: (./dispatch-task)
